<html lang="uz">
<head>
<meta charset="UTF-8">

<title>KinoUz</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#08090d;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:100;

    display:flex;
    align-items:center;
    gap:30px;

    padding:16px 5%;

    background:#111217;
    border-bottom:1px solid #292a30;
}

.logo{
    font-size:28px;
    font-weight:bold;
    color:#e50914;
}

nav{
    display:flex;
    gap:20px;
}

nav a{
    color:#ddd;
    text-decoration:none;
}

nav a:hover{
    color:#e50914;
}

.search{
    margin-left:auto;

    width:300px;

    padding:12px 18px;

    border:1px solid #333;
    border-radius:25px;

    background:#1c1d23;
    color:white;

    outline:none;
}

/* HERO */

.hero{
    min-height:430px;

    display:flex;
    align-items:center;

    padding:60px 7%;

    background:
    linear-gradient(
        90deg,
        #08090d 10%,
        rgba(8,9,13,.7),
        rgba(8,9,13,.1)
    ),
    url("https://image.tmdb.org/t/p/w1280/8YFL5QQVPy3AgrEQxNYVSgiPEbe.jpg")
    center/cover;
}

.hero h1{
    font-size:55px;
    margin-bottom:15px;
}

.hero p{
    max-width:600px;

    color:#ccc;

    line-height:1.7;

    margin-bottom:25px;
}

.button{
    padding:13px 25px;

    border:0;
    border-radius:7px;

    background:#e50914;
    color:white;

    font-weight:bold;

    cursor:pointer;
}

.button:hover{
    background:#b20710;
}

/* GENRES */

.genres{
    display:flex;
    gap:10px;

    padding:25px 5%;

    overflow-x:auto;
}

.genre{
    padding:10px 18px;

    border-radius:25px;

    background:#191a20;

    white-space:nowrap;

    cursor:pointer;
}

.genre:hover,
.genre.active{
    background:#e50914;
}

/* CONTENT */

.container{
    width:90%;
    max-width:1500px;

    margin:auto;
}

.title{
    font-size:28px;

    margin:25px 0 20px;
}

/* MOVIES */

.movies{
    display:grid;

    grid-template-columns:
    repeat(6,1fr);

    gap:18px;
}

.movie{
    overflow:hidden;

    background:#15161c;

    border-radius:9px;

    cursor:pointer;

    transition:.25s;
}

.movie:hover{
    transform:translateY(-7px);

    box-shadow:
    0 15px 35px rgba(0,0,0,.65);
}

.movie img{
    width:100%;
    height:285px;

    display:block;

    object-fit:cover;

    background:#191a20;
}

.movie-info{
    padding:12px;
}

.movie-title{
    min-height:40px;

    font-size:15px;

    line-height:1.35;
}

.movie-year{
    margin-top:7px;

    color:#888;

    font-size:13px;
}

.rating{
    float:right;

    color:#ffc107;
}

/* LOAD */

.load-more{
    display:block;

    margin:40px auto;

    padding:13px 28px;

    border:0;
    border-radius:7px;

    background:#e50914;
    color:white;

    font-weight:bold;

    cursor:pointer;
}

.load-more:hover{
    background:#b20710;
}

/* MESSAGE */

.message{
    display:none;

    padding:60px;

    text-align:center;

    color:#888;
}

/* MODAL */

.modal{
    display:none;

    position:fixed;

    inset:0;

    z-index:999;

    overflow:auto;

    padding:30px 15px;

    background:rgba(0,0,0,.93);
}

.modal-box{
    position:relative;

    max-width:850px;

    margin:auto;

    padding:30px;

    background:#17181e;

    border-radius:12px;
}

.close{
    position:absolute;

    right:15px;
    top:15px;

    width:40px;
    height:40px;

    border:0;

    border-radius:50%;

    background:#e50914;

    color:white;

    font-size:24px;

    cursor:pointer;
}

.modal-poster{
    width:230px;
    max-width:100%;

    border-radius:8px;

    margin-bottom:20px;
}

.modal-title{
    font-size:32px;

    margin-bottom:12px;
}

.modal-text{
    color:#bbb;

    line-height:1.7;

    margin:12px 0;
}

.trailer{
    margin-top:25px;
}

.trailer iframe{
    width:100%;
    height:430px;

    border:0;

    border-radius:8px;
}

/* FOOTER */

footer{
    margin-top:60px;

    padding:30px;

    text-align:center;

    color:#777;

    background:#111217;
}

/* RESPONSIVE */

@media(max-width:1200px){

    .movies{
        grid-template-columns:repeat(5,1fr);
    }

}

@media(max-width:950px){

    .movies{
        grid-template-columns:repeat(4,1fr);
    }

}

@media(max-width:700px){

    header{
        flex-wrap:wrap;
    }

    nav{
        display:none;
    }

    .search{
        width:100%;

        margin-left:0;
    }

    .hero h1{
        font-size:40px;
    }

    .movies{
        grid-template-columns:repeat(3,1fr);
    }

    .movie img{
        height:230px;
    }

}

@media(max-width:500px){

    .movies{
        grid-template-columns:repeat(2,1fr);

        gap:12px;
    }

    .movie img{
        height:220px;
    }

    .hero{
        min-height:350px;
    }

}
</style>

/*
====================================================
FILMLARNI CHIQARISH
====================================================
*/

const moviesBox =
document.getElementById("movies");


function renderMovies(list){

    moviesBox.innerHTML = "";


    const message =
    document.getElementById("message");


    if(list.length === 0){

        message.style.display = "block";

        document
        .getElementById("loadMore")
        .style.display = "none";

        return;

    }


    message.style.display = "none";


    list.forEach(movie => {

        const card =
        document.createElement("article");


        card.className = "movie";


        card.innerHTML = `

            <img
                src="${movie.poster}"
                alt="${movie.title}"
                loading="lazy"
            >

            <div class="movie-info">

                <div class="movie-title">

                    ${movie.title}

                    <span class="rating">
                        ⭐ ${movie.rating}
                    </span>

                </div>

                <div class="movie-year">
                    ${movie.year} • ${movie.genre}
                </div>

            </div>

        `;


        card.onclick = function(){

            openMovie(movie);

        };


        moviesBox.appendChild(card);

    });


    document
    .getElementById("loadMore")
    .style.display = "block";

}


renderMovies(movies);

document
.getElementById("search")
.addEventListener(
    "input",
    function(){

        const value =
        this.value
        .toLowerCase()
        .trim();


        const result =
        movies.filter(movie =>

            movie.title
            .toLowerCase()
            .includes(value)

            ||

            movie.genre
            .toLowerCase()
            .includes(value)

            ||

            movie.year
            .includes(value)

        );


        renderMovies(result);

    }
);


/*
====================================================
JANRLAR
====================================================
*/

document
.querySelectorAll(".genre")
.forEach(button => {

    button.addEventListener(
        "click",
        function(){

            document
            .querySelectorAll(".genre")
            .forEach(
                item =>
                item.classList.remove("active")
            );


            this.classList.add("active");


            document
            .getElementById("search")
            .value = "";


            const selected =
            this.dataset.genre;


            if(selected === "all"){

                renderMovies(movies);

            }

            else{

                renderMovies(
                    movies.filter(
                        movie =>
                        movie.genre === selected
                    )
                );

            }

        }
    );

});

function openMovie(movie){

    const modal =
    document.getElementById("modal");


    const content =
    document.getElementById("modalContent");


    content.innerHTML = `

        <img
            class="modal-poster"
            src="${movie.poster}"
            alt="${movie.title}"
        >

        <h2 class="modal-title">
            ${movie.title}
        </h2>

        <p class="modal-text">

            ⭐ ${movie.rating}

            &nbsp; • &nbsp;

            ${movie.year}

            &nbsp; • &nbsp;

            ${movie.genre}

        </p>

        <p class="modal-text">
            ${movie.text}
        </p>

        <button
            class="button"
            onclick="
                showTrailer('${movie.trailer}')
            "
        >
            ▶ Trailer ko‘rish
        </button>

        <div
            id="trailer"
            class="trailer"
        ></div>

    `;


    modal.style.display = "block";

}


/*
====================================================
TRAILER
====================================================
*/

function showTrailer(id){

    const trailer =
    document.getElementById("trailer");


    trailer.innerHTML = `

        <iframe
            src="https://www.youtube.com/embed/${id}"
            title="Film trailer"
            allowfullscreen
        ></iframe>

    `;

}

function closeModal(){

    document
    .getElementById("modal")
    .style.display = "none";

}


window.addEventListener(
    "click",
    function(event){

        const modal =
        document.getElementById("modal");


        if(event.target === modal){

            closeModal();

        }

    }
);
